name: Release Multi-Mac Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Releases
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build All Multi-Architecture Assets
        run: |
          chmod +x scripts/build_all_mac.sh
          ./scripts/build_all_mac.sh

      - name: Generate Detailed Release Notes
        run: |
          VERSION="${{ github.ref_name }}"
          cat << EOF > release_body.md
          ## 🚀 Workstation Monitor ${VERSION}

          macOS 原生轻量工作站性能监控与网络诊断总控台发布！  
          *Native lightweight macOS workstation performance monitoring & network diagnostic mission control.*

          ---

          ### 📦 资产下载推荐 / Asset Downloads
          | 架构 / Architecture | 适用机型 / Supported Machines | 安装镜像 / Installer (DMG) | 独立压缩包 / Portable (.app.zip) |
          | :--- | :--- | :--- | :--- |
          | 🌟 **Universal (通用版)** | 兼容所有 Mac / All Macs (M1~M4 & Intel) | [Universal DMG](https://github.com/army-u8/workstation-monitor/releases/download/${VERSION}/Workstation_Monitor_${VERSION#v}_universal.dmg) | [Universal App (.zip)](https://github.com/army-u8/workstation-monitor/releases/download/${VERSION}/Workstation_Monitor_${VERSION#v}_universal.app.zip) |
          | ⚡ **Apple Silicon** | M1 / M2 / M3 / M4 芯片 Mac | [Apple Silicon DMG](https://github.com/army-u8/workstation-monitor/releases/download/${VERSION}/Workstation_Monitor_${VERSION#v}_aarch64.dmg) | [Apple Silicon App (.zip)](https://github.com/army-u8/workstation-monitor/releases/download/${VERSION}/Workstation_Monitor_${VERSION#v}_aarch64.app.zip) |
          | 💻 **Intel Mac** | 传统 Intel 处理器 Mac / Intel-based Macs | [Intel Mac DMG](https://github.com/army-u8/workstation-monitor/releases/download/${VERSION}/Workstation_Monitor_${VERSION#v}_x64.dmg) | [Intel Mac App (.zip)](https://github.com/army-u8/workstation-monitor/releases/download/${VERSION}/Workstation_Monitor_${VERSION#v}_x64.app.zip) |

          ---

          ### 💡 自动在线更新说明 / In-App Auto-Update Guide
          - 🇨🇳 **中文**：本版本已内置**一键在线热升级系统**。当前及后续版本的用户打开网页控制台后将自动检测新版本，可在右上角直接点击 **「立即升级并重启」** 无感热更新，无需重新手动下载 DMG。
          - 🇺🇸 **English**: This release features the **One-Click In-App Auto-Updater**. Starting from this version, new updates will be detected automatically in the web mission control console. Simply click **"Update & Restart Now"** in the top-right header for seamless in-place hot-reloads without manual DMG downloads.

          ---

          ### 🔐 校验和 / SHA256 Checksums
          \`\`\`text
          $(cat target/release-assets/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: target/release-assets/*
          body_path: release_body.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
