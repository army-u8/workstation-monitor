[package]
name = "workstation-monitor"
version = "0.1.2"
edition = "2021"
build = "build.rs"
default-run = "workstation-monitor"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
netstat2 = "0.9"
pcap = "0.11"
rust-embed = "8.5"
mime_guess = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
open = "5"

# Packaging config for `cargo bundle` (produces Workstation Monitor.app).
# Usage: cargo install cargo-bundle && cargo bundle --release
[package.metadata.bundle]
name = "Workstation Monitor"
identifier = "com.armyu8.workstation-monitor"
version = "0.1.1"
category = "Utility"
short_description = "macOS workstation monitoring dashboard"
long_description = "A self-hosted, single-binary dashboard for monitoring and operating your macOS workstation."
icon = ["assets/icon.icns"]
copyright = "Copyright (c) 2026 army-u8. All rights reserved."

